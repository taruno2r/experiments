<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Experiments</title>
  <meta name="description" content="Small UI interaction experiments you can play with." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --border: #ececee;
      --text: #0a0a0a;
      --muted: #71717a;
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0b0c;
        --card: #141416;
        --border: #232326;
        --text: #f4f4f5;
        --muted: #9a9aa3;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }

    header {
      margin-bottom: 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .card {
      display: block;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: transform 200ms ease, border-color 200ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--border), var(--text) 15%);
    }

    .card:focus-visible {
      outline: 2px solid #7c5cfa;
      outline-offset: 3px;
    }

    .card-media {
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }

    /* Live, static render of the experiment page — not clickable. */
    .card iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    .card-body {
      padding: 16px 20px 20px;
    }

    .card h2 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 500;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Experiments</h1>
      <p>Small UI interactions. Open one to play with it.</p>
    </header>

    <!-- Add a card per experiment: folder name, title, one line. -->
    <ul class="grid">
      <li>
        <a class="card" href="task-list/">
          <div class="card-media">
            <iframe src="task-list/" title="" tabindex="-1" aria-hidden="true" loading="lazy"></iframe>
          </div>
          <div class="card-body">
            <h2>Task List</h2>
            <p>Check items off and watch them settle into place.</p>
          </div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
