<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Experiments</title>
  <meta name="description" content="Small UI interaction experiments you can play with." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fcfcfc;
      --card: #ffffff;
      --card-border: #ededed;
      --preview: #f7f7f7;
      --preview-border: #efefef;
      --button: #f2f2f2;
      --button-hover: #e9e9e9;
      --text: #0a0a0a;
      --muted: #737373;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 1056px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }

    h1 {
      margin: 0 0 40px;
      text-align: center;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
      gap: 24px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .card {
      position: relative;
      padding: 12px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      background: var(--card);
    }

    .preview {
      overflow: hidden;
      aspect-ratio: 8 / 7;
      border: 1px solid var(--preview-border);
      border-radius: 14px;
      background: var(--preview);
    }

    /* Live, static render of the experiment page — not clickable. */
    .preview iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 6px 4px 8px;
    }

    .meta-text {
      flex: 1;
      min-width: 0;
    }

    .card h2 {
      margin: 0 0 3px;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 20px;
    }

    /* The whole card opens the experiment; the button is the visible cue. */
    .open {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--button);
      color: var(--text);
      transition: background 150ms ease;
    }

    .open::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 20px;
    }

    .card:hover .open {
      background: var(--button-hover);
    }

    .open:focus-visible {
      outline: 2px solid #7c5cfa;
      outline-offset: 2px;
    }

    .open svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Experiments</h1>

    <!-- Add a card per experiment: folder name, title, one line. -->
    <ul class="grid">
      <li class="card">
        <div class="preview">
          <iframe src="task-list/" title="" tabindex="-1" aria-hidden="true" loading="lazy"></iframe>
        </div>
        <div class="meta">
          <div class="meta-text">
            <h2>Task list</h2>
            <p>Tick, strike and reorder</p>
          </div>
          <a class="open" href="task-list/" aria-label="Open Task list">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5.5 4.5h6v6M11.5 4.5l-7 7" />
            </svg>
          </a>
        </div>
      </li>
    </ul>
  </main>
</body>
</html>
