<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Experiments</title>
  <meta name="description" content="Small UI interaction experiments you can play with." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fcfcfc;
      --card: #ffffff;
      --card-border: #ededed;
      --preview: #f7f7f7;
      --preview-border: #efefef;
      --text: #0a0a0a;
      --muted: #737373;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 1056px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }

    h1 {
      margin: 0 0 40px;
      text-align: center;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    @media (max-width: 943px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 539px) {
      .grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      display: block;
      padding: 12px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 24px -12px rgba(0, 0, 0, 0);
      transition:
        transform 250ms cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 250ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 24px -12px rgba(0, 0, 0, 0.12);
    }

    .card:focus-visible {
      outline: 2px solid #7c5cfa;
      outline-offset: 3px;
    }

    .preview {
      overflow: hidden;
      aspect-ratio: 8 / 7;
      border: 1px solid var(--preview-border);
      border-radius: 14px;
      background: var(--preview);
    }

    /* Live, static render of the experiment page — not clickable. */
    .preview iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    .meta {
      padding: 14px 8px 4px;
    }


    .card h2 {
      margin: 0 0 3px;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 20px;
    }

  </style>
</head>
<body>
  <main>
    <h1>Experiments</h1>

    <!-- Add a card per experiment: folder name, title, one line. -->
    <ul class="grid">
      <li>
        <a class="card" href="task-list/">
          <div class="preview">
            <iframe src="task-list/" title="" tabindex="-1" aria-hidden="true" loading="lazy"></iframe>
          </div>
          <div class="meta">
            <h2>Task list</h2>
            <p>Tick, strike and reorder</p>
          </div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
